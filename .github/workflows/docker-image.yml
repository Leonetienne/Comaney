name: Docker image

on:
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: leonetienne/comaney

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # every trigger builds the newest release tag, never master
      - name: Check out newest release
        id: release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          git checkout --quiet "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Deployment/Dockerfile
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}-${{ steps.release.outputs.date }}
            ${{ env.IMAGE }}:latest
          pull: true
          no-cache: true
          push: true

      # scans after the push, so available fixes ship even while other CVEs remain open.
      # pinned to a commit: trivy-action release tags were hijacked in 2026
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
